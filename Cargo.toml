[workspace.package]
version = "0.0.1"
authors = ["Julian Sparber"]
description = "GObject Bindings for p2panda"
license = "MPL-2.0 OR LGPL-2.1-or-later"
homepage = "https://github.com/p2panda/p2panda-gobject"
repository = "https://github.com/p2panda/p2panda-gobject"
edition = "2024"
rust-version = "1.92"

[profile.release]
lto = true
codegen-units = 1

[workspace]
resolver = "3"
members = [
    "p2panda-gobject",
    "libp2panda", "libp2panda-rebind/libp2panda-rebind", "libp2panda-rebind/libp2panda-rebind/sys",
]
exclude = ["libp2panda-rebind/gir"]

[workspace.dependencies]
p2panda-gobject = { path = "p2panda-gobject/" }
libc = { version = "0.2" }
gobject-sys = { version = "0.22.0", features = ["v2_80"] }
glib = { version = "0.22.0", features = ["v2_80"] }
glib-sys = { version = "0.22.0", features = ["v2_80"] }
gio = { version = "0.22.0", features = ["v2_80"] }
gio-sys = { version = "0.22.0", features = ["v2_80"] }
